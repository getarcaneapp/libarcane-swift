included:
  - Sources/Arcane
  - Sources/ArcaneOIDC
  - Tests

excluded:
  - .build
  - Sources/ArcaneAPI

analyzer_rules:
  - unused_import

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 140

type_body_length:
  warning: 400
  error: 700

file_length:
  warning: 500
  error: 900

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
