name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Xcode version
        run: xcodebuild -version
      - name: SDK versions
        run: xcodebuild -showsdks
      - name: Swift version
        run: swift --version
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Debug tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Lint
        run: swiftlint lint --strict

  ios-build:
    name: Build ${{ matrix.product }} / ${{ matrix.platform }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        product: [Arcane, ArcaneOIDC, ArcanePasskeys]
        platform: [iOS, iOS Simulator]
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Release build
        run: >-
          xcodebuild build -scheme '${{ matrix.product }}' -configuration Release
          -destination 'generic/platform=${{ matrix.platform }}' CODE_SIGNING_ALLOWED=NO

  ios-tests:
    name: Test iOS ${{ matrix.ios }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: "18.6"
            model: iPhone 16
          - ios: "27.0"
            model: iPhone 18 Pro
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Install iOS 18.6 runtime
        if: matrix.ios == '18.6'
        # iOS 18.x runtimes are only published as universal; arm64-only variants start at iOS 26.
        run: |
          if xcrun simctl list runtimes | grep -q 'iOS 18.6'; then
            echo "iOS 18.6 runtime already installed"
          else
            xcodebuild -downloadPlatform iOS -buildVersion 18.6
          fi
      - name: Create iOS 18.6 simulator
        if: matrix.ios == '18.6'
        run: xcrun simctl create 'iPhone 16' 'iPhone 16' com.apple.CoreSimulator.SimRuntime.iOS-18-6
      - uses: futureware-tech/simulator-action@v6
        id: simulator
        with:
          os: iOS
          os_version: ${{ matrix.ios }}
          model: ${{ matrix.model }}
          wait_for_boot: true
      - name: Run package tests
        run: >-
          xcodebuild test -scheme arcane-swift-Package
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
