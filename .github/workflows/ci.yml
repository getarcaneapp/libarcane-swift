name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Swift version
        run: swift --version
      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null; then
            brew install swiftlint
          fi
          swiftlint version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint
        run: swiftlint lint
